name: build susfs_userspace

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: universal-binary

      - name: grab ndk
        run: |
          curl -L https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -o ndk-linux.zip
          unzip ndk-linux.zip

      - name: grab zig
        run: |
          curl -L https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          mv zig-* zig

      - name: grab sstrip from ELFkickers
        run: |
          curl -L https://www.muppetlabs.com/~breadbox/pub/software/ELFkickers-3.2.tar.gz -o sstrip.tar.gz
          tar xf sstrip.tar.gz
          make -C ELFkickers-3.2 sstrip
          cp ELFkickers-3.2/sstrip/sstrip .

      - name: compile via zigcc
        run: |
          ls -la ; pwd
          echo "for now only aarch64 is built"
          chmod +x sstrip
          
          ./zig/zig cc -target aarch64-linux -s -Oz main.c -static -s -Wl,--gc-sections -o ksu_susfs_arm64 -I ./android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include

          upx --ultra-brute ksu_susfs_arm64
          ./sstrip ksu_susfs_arm64;

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ksu_susfs_arm64
          git commit -m "Update susfs_userspace binaries"
          git push origin universal-binary

